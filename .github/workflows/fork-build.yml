name: Fork Build (unsigned)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_$(grep '^xcode ' .tool-versions | awk '{print $2}').app"

      - name: Resolve GhosttyKit version
        run: echo "GHOSTTY_TAG=$(gh release list --repo muxy-app/ghostty --limit 1 --json tagName -q '.[0].tagName')" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Cache GhosttyKit
        uses: actions/cache@v4
        with:
          path: |
            GhosttyKit.xcframework
            GhosttyKit/ghostty.h
            Muxy/Resources/ghostty
            Muxy/Resources/terminfo
          key: ghosttykit-${{ env.GHOSTTY_TAG }}

      - name: Setup GhosttyKit
        run: scripts/setup.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install create-dmg
        run: npm install --global create-dmg

      - name: Build unsigned app
        run: |
          chmod +x scripts/build-release.sh scripts/create-icns.sh
          scripts/build-release.sh --arch arm64 --version 0.0.0

      - name: Use isolated bundle identifier
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.mux.app" build/Muxy.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Muxy (zh)" build/Muxy.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Muxy (zh)" build/Muxy.app/Contents/Info.plist

      - name: Ad-hoc sign for local launch
        run: codesign --force --deep --sign - build/Muxy.app

      - name: Zip app
        run: ditto -c -k --keepParent build/Muxy.app build/Muxy-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Muxy-arm64-zh
          path: |
            build/Muxy-arm64.zip
            build/*.dmg
          if-no-files-found: warn
